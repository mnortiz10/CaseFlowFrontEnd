<h2 mat-dialog-title>{{ 'TICKETS.EXTEND_TIME' | translate }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col gap-1 pt-1">
    <mat-form-field appearance="outline">
      <mat-label>{{ 'TICKETS.EXTENSION_HOURS' | translate }}</mat-label>
      <input matInput type="number" formControlName="extensionHours" min="1" />
      <mat-hint>{{ 'TICKETS.EXTENSION_HINT' | translate }}</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ 'TICKETS.EXTENSION_REASON' | translate }}</mat-label>
      <textarea matInput formControlName="reason" rows="3"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="null">{{ 'COMMON.CANCEL' | translate }}</button>
  <button mat-flat-button color="primary" [disabled]="saving" (click)="save()">
    @if (saving) {
      <mat-spinner diameter="20"></mat-spinner>
    } @else {
      {{ 'TICKETS.EXTEND' | translate }}
    }
  </button>
</mat-dialog-actions>
